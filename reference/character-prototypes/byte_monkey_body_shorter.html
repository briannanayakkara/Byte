<div style="padding:1rem 0;">
<h2 class="sr-only">Interactive preview of a compact cartoon monkey with hands clearly separated from the body and a gentler, cozier sleepy expression; pose and face change per mood and eyes follow your mouse.</h2>

<div style="display:flex;justify-content:center;margin-bottom:1.25rem;">
  <svg id="mk" width="320" height="320" viewBox="0 0 320 320" role="img" style="max-width:76vw;">
    <title>Byte monkey full body</title>
    <desc>A compact goofy monkey with hands clearly visible away from the body, and a cozy sleepy expression; whole pose changes with each mood.</desc>

    <g id="heartsFloat"></g>

    <g id="bobG">
      <path id="tail" d="M188 250 Q240 250 238 206 Q237 182 222 186" fill="none" stroke="#8A5A34" stroke-width="11" stroke-linecap="round"/>

      <ellipse cx="134" cy="270" rx="14" ry="16" fill="#8A5A34"/><ellipse cx="134" cy="281" rx="15" ry="8" fill="#5A3A20"/>
      <ellipse cx="176" cy="270" rx="14" ry="16" fill="#8A5A34"/><ellipse cx="176" cy="281" rx="15" ry="8" fill="#5A3A20"/>

      <g id="armL"><path d="M116 214 Q94 226 90 250" fill="none" stroke="#8A5A34" stroke-width="12" stroke-linecap="round"/><circle cx="90" cy="253" r="11" fill="#C89B72"/></g>
      <g id="armR"><path d="M194 214 Q216 226 220 250" fill="none" stroke="#8A5A34" stroke-width="12" stroke-linecap="round"/><circle cx="220" cy="253" r="11" fill="#C89B72"/></g>

      <ellipse id="body" cx="155" cy="230" rx="46" ry="44" fill="#8A5A34"/>
      <ellipse id="belly" cx="155" cy="234" rx="26" ry="27" fill="#E9CBA0"/>

      <g id="headG">
        <circle cx="88" cy="112" r="28" fill="#7A4E2D"/><circle cx="88" cy="112" r="15.5" fill="#C89B72"/>
        <circle cx="222" cy="112" r="28" fill="#7A4E2D"/><circle cx="222" cy="112" r="15.5" fill="#C89B72"/>

        <path d="M155 50 C204 50 220 89 220 122 C220 163 191 188 155 188 C119 188 90 163 90 122 C90 89 106 50 155 50 Z" fill="#8A5A34"/>
        <path d="M116 132 C116 99 136 87 155 87 C174 87 194 99 194 132 C194 167 177 180 155 180 C133 180 116 167 116 132 Z" fill="#E9CBA0"/>

        <g id="ewL"><ellipse cx="135" cy="122" rx="17.5" ry="21" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2.5"/></g>
        <g id="ewR"><ellipse cx="174" cy="122" rx="17.5" ry="21" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2.5"/></g>
        <g id="irisL"><circle cx="135" cy="124" r="9.5" fill="#4A2E18"/><circle cx="135" cy="124" r="5.2" fill="#1a1a1a"/><circle cx="132" cy="121" r="2.6" fill="#FFFFFF"/></g>
        <g id="irisR"><circle cx="174" cy="124" r="9.5" fill="#4A2E18"/><circle cx="174" cy="124" r="5.2" fill="#1a1a1a"/><circle cx="171" cy="121" r="2.6" fill="#FFFFFF"/></g>
        <g id="heartEyeL" style="opacity:0"><path d="M135 130 L127 122 A4.8 4.8 0 0 1 135 116 A4.8 4.8 0 0 1 143 122 Z" fill="#E24B6A"/></g>
        <g id="heartEyeR" style="opacity:0"><path d="M174 130 L166 122 A4.8 4.8 0 0 1 174 116 A4.8 4.8 0 0 1 182 122 Z" fill="#E24B6A"/></g>
        <path id="sleepyLidL" d="M117 122 Q135 134 153 122" fill="none" stroke="#5A3A20" stroke-width="3" stroke-linecap="round" style="opacity:0"/>
        <path id="sleepyLidR" d="M156 122 Q174 134 192 122" fill="none" stroke="#5A3A20" stroke-width="3" stroke-linecap="round" style="opacity:0"/>

        <path id="browL" d="M121 98 Q135 92 147 97" fill="none" stroke="#4A2E18" stroke-width="4.3" stroke-linecap="round"/>
        <path id="browR" d="M163 97 Q174 92 189 98" fill="none" stroke="#4A2E18" stroke-width="4.3" stroke-linecap="round"/>

        <ellipse cx="147" cy="148" rx="3" ry="4" fill="#2C2C2A"/><ellipse cx="163" cy="148" rx="3" ry="4" fill="#2C2C2A"/>
        <path id="mouth" d="M137 163 Q155 176 173 163" fill="none" stroke="#6E4326" stroke-width="3.3" stroke-linecap="round"/>
        <ellipse id="cheekL" cx="121" cy="154" rx="9.5" ry="6" fill="#D98A5A" opacity="0"/>
        <ellipse id="cheekR" cx="189" cy="154" rx="9.5" ry="6" fill="#D98A5A" opacity="0"/>
        <g id="sleepZ" style="opacity:0" fill="#8B98AC"><text x="196" y="60" font-size="17" font-family="sans-serif" font-weight="bold">z</text><text x="210" y="42" font-size="12" font-family="sans-serif" font-weight="bold">z</text></g>
      </g>
    </g>
  </svg>
</div>

<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:500px;margin:0 auto;">
  <button data-m="happy">Happy</button>
  <button data-m="excited">Excited</button>
  <button data-m="curious">Curious</button>
  <button data-m="sleepy">Sleepy</button>
  <button data-m="confused">Confused</button>
  <button data-m="lovestruck">Lovestruck</button>
  <button data-m="neutral">Neutral</button>
  <button data-m="talk">Talk</button>
</div>

<script>
(function(){
  const svg=document.getElementById('mk'), bob=document.getElementById('bobG'), headG=document.getElementById('headG');
  const irisL=document.getElementById('irisL'), irisR=document.getElementById('irisR');
  const ewL=document.getElementById('ewL'), ewR=document.getElementById('ewR');
  const heartEyeL=document.getElementById('heartEyeL'), heartEyeR=document.getElementById('heartEyeR');
  const sleepyLidL=document.getElementById('sleepyLidL'), sleepyLidR=document.getElementById('sleepyLidR');
  const browL=document.getElementById('browL'), browR=document.getElementById('browR');
  const mouth=document.getElementById('mouth');
  const cheekL=document.getElementById('cheekL'), cheekR=document.getElementById('cheekR');
  const armL=document.getElementById('armL'), armR=document.getElementById('armR');
  const tail=document.getElementById('tail');
  const sleepZ=document.getElementById('sleepZ');
  const floatWrap=document.getElementById('heartsFloat');
  const baseL={x:135,y:124}, baseR={x:174,y:124};
  let mood='happy', talking=false, talkUntil=0, mx=155, my=124, t=0, last=performance.now();

  const mouths={happy:"M137 163 Q155 176 173 163",excited:"M135 161 Q155 182 175 161 Q155 171 135 161 Z",curious:"M149 167 Q155 163 161 167",sleepy:"M147 166 Q155 172 163 166",confused:"M139 167 Q149 161 157 169 Q165 175 171 167",lovestruck:"M135 161 Q155 178 175 161",neutral:"M145 165 L165 165"};
  const brows={
    happy:{l:"M121 97 Q135 91 147 96",r:"M163 96 Q174 91 189 97"},
    excited:{l:"M121 92 Q135 85 147 90",r:"M163 90 Q174 85 189 92"},
    curious:{l:"M121 93 Q135 86 147 91",r:"M163 100 Q174 95 189 102"},
    sleepy:{l:"M123 108 Q135 105 145 107",r:"M165 107 Q174 105 187 108"},
    confused:{l:"M121 91 Q135 86 147 95",r:"M163 102 Q174 98 189 105"},
    lovestruck:{l:"M121 96 Q135 89 147 95",r:"M163 95 Q174 89 189 96"},
    neutral:{l:"M121 99 Q135 95 147 99",r:"M163 99 Q174 95 189 99"},
    talk:{l:"M121 97 Q135 91 147 96",r:"M163 96 Q174 91 189 97"}
  };
  const armPoses={
    rest:{l:{p:"M116 214 Q94 226 90 250",hx:90,hy:253},r:{p:"M194 214 Q216 226 220 250",hx:220,hy:253}},
    up:{l:{p:"M116 212 Q92 192 84 168",hx:82,hy:163},r:{p:"M194 212 Q218 192 226 168",hx:228,hy:163}},
    cheeks:{l:{p:"M116 212 Q108 180 124 152",hx:126,hy:145},r:{p:"M194 212 Q202 180 186 152",hx:184,hy:145}},
    scratch:{l:{p:"M116 214 Q94 226 90 250",hx:90,hy:253},r:{p:"M194 212 Q222 172 202 90",hx:200,hy:84}},
    droop:{l:{p:"M118 216 Q100 240 96 262",hx:96,hy:265},r:{p:"M192 216 Q210 240 214 262",hx:214,hy:265}}
  };
  function setArm(g,pose){g.querySelector('path').setAttribute('d',pose.p);const h=g.querySelector('circle');h.setAttribute('cx',pose.hx);h.setAttribute('cy',pose.hy);}

  let hearts=[];
  function heartPath(x,y,s){return `M${x} ${y+6*s} L${x-6*s} ${y-1*s} A${3.5*s} ${3.5*s} 0 0 1 ${x} ${y-5*s} A${3.5*s} ${3.5*s} 0 0 1 ${x+6*s} ${y-1*s} Z`;}
  function spawnHeart(){const p=document.createElementNS('http://www.w3.org/2000/svg','path');const x=105+Math.random()*95,s=0.7+Math.random()*0.8;p.setAttribute('fill',Math.random()<0.5?'#E24B6A':'#ED93B1');floatWrap.appendChild(p);hearts.push({el:p,x,y:112,s,vy:0.35+Math.random()*0.3,sway:Math.random()*6.28});}

  function blink(c){const ry=c?'3':'21';ewL.querySelector('ellipse').setAttribute('ry',ry);ewR.querySelector('ellipse').setAttribute('ry',ry);
    if(mood!=='lovestruck'&&mood!=='sleepy'){irisL.style.opacity=c?'0':'1';irisR.style.opacity=c?'0':'1';}}

  function setMood(m){mood=m;talking=false;
    const love=(m==='lovestruck'), sleep=(m==='sleepy');
    heartEyeL.style.opacity=love?'1':'0';heartEyeR.style.opacity=love?'1':'0';
    sleepyLidL.style.opacity=sleep?'1':'0';sleepyLidR.style.opacity=sleep?'1':'0';
    irisL.style.opacity=(love||sleep)?'0':'1';irisR.style.opacity=(love||sleep)?'0':'1';
    ewL.style.opacity=sleep?'0':'1'; ewR.style.opacity=sleep?'0':'1';
    cheekL.setAttribute('opacity',(m==='excited'||love)?'0.9':'0');cheekR.setAttribute('opacity',(m==='excited'||love)?'0.9':'0');
    const b=brows[m]||brows.happy;browL.setAttribute('d',b.l);browR.setAttribute('d',b.r);
    sleepZ.style.opacity=sleep?'1':'0';
    if(m==='excited'){setArm(armL,armPoses.up.l);setArm(armR,armPoses.up.r);}
    else if(m==='lovestruck'){setArm(armL,armPoses.cheeks.l);setArm(armR,armPoses.cheeks.r);}
    else if(m==='confused'||m==='curious'){setArm(armL,armPoses.scratch.l);setArm(armR,armPoses.scratch.r);}
    else if(sleep){setArm(armL,armPoses.droop.l);setArm(armR,armPoses.droop.r);}
    else {setArm(armL,armPoses.rest.l);setArm(armR,armPoses.rest.r);}
    if(m==='talk'){talking=true;talkUntil=performance.now()+2600;}else mouth.setAttribute('d',mouths[m]||mouths.happy);
    if(!love){hearts.forEach(h=>h.el.remove());hearts=[];}
  }
  svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*320;my=((e.clientY-r.top)/r.height)*320;});
  svg.addEventListener('mouseleave',()=>{mx=155;my=124;});
  function track(base,el){const dx=mx-base.x,dy=my-base.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,6);el.setAttribute('transform',`translate(${dx/d*m} ${dy/d*m})`);}
  let nextBlink=1500,heartTimer=0;
  function loop(now){const dt=now-last;last=now;t+=dt;
    const bounceAmp=(mood==='excited')?6.5:(mood==='sleepy')?2:3;
    const bounceSpd=(mood==='excited')?300:(mood==='sleepy')?1500:620;
    bob.style.transformOrigin='155px 288px';bob.setAttribute('transform',`translate(0 ${Math.sin(t/bounceSpd)*bounceAmp}) rotate(${Math.sin(t/1100)*1} 155 230)`);
    headG.setAttribute('transform',(mood==='curious')?'rotate(-5 155 180)':(mood==='sleepy')?'rotate(5 155 180)':'');
    const tSpd=(mood==='excited')?260:700, tAmp=(mood==='excited')?14:9;
    tail.setAttribute('d',`M188 250 Q240 250 238 ${206+Math.sin(t/tSpd)*tAmp} Q237 182 ${222+Math.sin(t/tSpd)*5} 186`);
    if(mood==='lovestruck'){const p=1+Math.sin(t/220)*0.12;heartEyeL.style.transformOrigin='135px 122px';heartEyeR.style.transformOrigin='174px 122px';heartEyeL.setAttribute('transform',`scale(${p})`);heartEyeR.setAttribute('transform',`scale(${p})`);heartTimer-=dt;if(heartTimer<=0){spawnHeart();heartTimer=420;}}
    else if(mood!=='sleepy'){track(baseL,irisL);track(baseR,irisR);}
    if(mood==='confused'||mood==='curious'){const w=Math.sin(t/120)*4;const h=armR.querySelector('circle');h.setAttribute('cx',200+w);}
    if(mood!=='sleepy'&&mood!=='lovestruck'){nextBlink-=dt;if(nextBlink<=0){blink(true);setTimeout(()=>{if(mood!=='sleepy'&&mood!=='lovestruck')blink(false);},110);nextBlink=1800+Math.random()*2500;}}
    hearts.forEach(h=>{h.y-=h.vy*dt*0.06;h.sway+=dt*0.003;const x=h.x+Math.sin(h.sway)*8;const op=h.y<72?Math.max(0,(h.y-40)/32):1;h.el.setAttribute('d',heartPath(x,h.y,h.s));h.el.setAttribute('opacity',op);});
    hearts=hearts.filter(h=>{if(h.y<40){h.el.remove();return false;}return true;});
    if(talking){if(now<talkUntil){const o=4.5+Math.abs(Math.sin(t/90))*10;mouth.setAttribute('d',`M137 163 Q155 ${163+o} 173 163 Q155 ${163+o*0.5} 137 163 Z`);}else{talking=false;setMood('happy');}}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>setMood(b.dataset.m)));
  setMood('happy');
})();
</script>
</div>
