        <rect x="88" y="64" width="144" height="108" rx="32" fill="none" stroke="#3A4470" stroke-width="5"/>
        <circle cx="82" cy="116" r="16" fill="#2C3350"/><circle cx="82" cy="116" r="16" fill="none" stroke="#3A4470" stroke-width="3"/>
        <circle cx="238" cy="116" r="16" fill="#2C3350"/><circle cx="238" cy="116" r="16" fill="none" stroke="#3A4470" stroke-width="3"/>

</div>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const screen=document.getElementById('screen'), topFx=document.getElementById('topFx'), fx=document.getElementById('fx');
  const bobG=document.getElementById('bobG'), headG=document.getElementById('headG');
  const lightL=document.getElementById('lightL'), lightR=document.getElementById('lightR');
  const rootG=document.getElementById('rootG'), shadow=document.getElementById('shadow');
  const legL=document.getElementById('legL'), footLa=document.getElementById('footLa'), footLb=document.getElementById('footLb');
  const legR=document.getElementById('legR'), footRa=document.getElementById('footRa'), footRb=document.getElementById('footRb');
  const handL=document.getElementById('handL'), handR=document.getElementById('handR');
  const TEAL='#3FE0D0', PINK='#F2749A', GOLD='#F2C94C', DIM='#3A3F52', RED='#E24B6A';
  const exL=135, exR=185, cyL=118;
  let mood='happy', t=0, last=performance.now(), blinkT=1500, extra={};

  function el(tag,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);return e;}
  function clear(g){while(g.firstChild)g.removeChild(g.firstChild);}
  function eye(x,y,w,h,rx,c){return el('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:rx,fill:c||TEAL});}
  function arc(d,c,w){return el('path',{d:d,fill:'none',stroke:c||TEAL,'stroke-width':w||6,'stroke-linecap':'round'});}
  function heartAt(x,y,s,c){return el('path',{d:`M${x} ${y+6*s} L${x-6*s} ${y-1*s} A${3.5*s} ${3.5*s} 0 0 1 ${x} ${y-5*s} A${3.5*s} ${3.5*s} 0 0 1 ${x+6*s} ${y-1*s} Z`,fill:c||PINK});}
  function star(x,y,r,c){const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=(i%2===0)?r:r*0.42;p.push(`${x+Math.cos(a)*rr} ${y+Math.sin(a)*rr}`);}return el('path',{d:'M'+p.join(' L')+' Z',fill:c||GOLD});}
  function txt(x,y,s,str,c){const e=el('text',{x:x,y:y,'font-size':s,'text-anchor':'middle','font-family':'sans-serif','font-weight':'bold',fill:c||TEAL});e.textContent=str;return e;}

  // ---- pose helpers ----
  function kf(p,pts){ // smoothstep keyframe interpolation through [phase,value] points
    if(p<=pts[0][0])return pts[0][1];
    for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(p<=b[0]){const q=(p-a[0])/(b[0]-a[0]),s=q*q*(3-2*q);return a[1]+(b[1]-a[1])*s;}}
    return pts[pts.length-1][1];
  }
  // Redraws a leg as a quadratic curve hip->foot; knee bends forward automatically
  // when the leg is compressed (crouch) or the foot is lifted (step).
  function setLeg(leg,ea,eb,hx,hy,bx,by,dx,dy,tw){
    const fpx=bx+dx, fpy=by+dy;
    ea.setAttribute('cx',fpx);ea.setAttribute('cy',fpy);eb.setAttribute('cx',fpx);eb.setAttribute('cy',fpy);
    const ex=fpx+tw*6, ey=fpy-6;
    const bl=Math.hypot(bx+tw*6-hx,by-6-hy), ln=Math.hypot(ex-hx,ey-hy);
    const bend=Math.min(16,Math.max(0,(bl-ln)*0.9)+Math.max(0,-dy)*0.55);
    const kx=(hx+ex)/2+bend, ky=(hy+ey)/2-bend*0.2;
    leg.setAttribute('d',`M${hx} ${hy} Q${kx} ${ky} ${ex} ${ey}`);
  }
  function dust(wx){for(let i=0;i<8;i++){const s=i<4?-1:1;const d=el('circle',{cx:wx+s*(52+Math.random()*26),cy:268+Math.random()*6,r:3+Math.random()*3.5,fill:'#8B98AC',opacity:0.6});fx.appendChild(d);dusts.push({el:d,vx:s*(1+Math.random()*1.3),vy:-0.5-Math.random()*0.8,life:1});}}

  const M={
    happy(){screen.append(eye(exL,cyL,26,20,9),eye(exR,cyL,26,20,9));extra.blink=true;},
    excited(){screen.append(star(exL,cyL,13),star(exR,cyL,13));extra.pulse=180;},

    neutral(){screen.append(eye(exL,cyL,26,13,6),eye(exR,cyL,26,13,6));extra.blink=true;},
    curious(){screen.append(eye(exL,cyL-4,20,20,10),eye(exR,cyL-4,20,20,10));topFx.append(txt(200,80,24,'?'));extra.tilt=-5;extra.blink=true;},
    confused(){const g=el('g',{});g.append(el('circle',{cx:exL,cy:cyL-2,r:14,fill:TEAL}),el('circle',{cx:exL-3,cy:cyL-6,r:4,fill:'#0A0C14'}),arc(`M${exR-13} ${cyL+4} Q${exR} ${cyL+12} ${exR+13} ${cyL+4}`,TEAL,7));screen.append(g);topFx.append(txt(200,80,24,'?'));extra.tilt=8;extra.wobble=true;},
    sad(){screen.append(arc(`M${exL-11} ${cyL+4} Q${exL} ${cyL-6} ${exL+11} ${cyL+4}`,TEAL,6),arc(`M${exR-11} ${cyL+4} Q${exR} ${cyL-6} ${exR+11} ${cyL+4}`,TEAL,6));topFx.append(el('path',{d:`M${exL+8} ${cyL+8} q4 8 0 12 q-4 -4 0 -12`,fill:'#5BD4FF',opacity:0.8}));extra.tilt=4;},
    surprised(){screen.append(el('circle',{cx:exL,cy:cyL,r:15,fill:TEAL}),el('circle',{cx:exR,cy:cyL,r:15,fill:TEAL}),el('circle',{cx:exL,cy:cyL,r:6,fill:'#0A0C14'}),el('circle',{cx:exR,cy:cyL,r:6,fill:'#0A0C14'}));topFx.append(txt(200,78,26,'!',GOLD));},
    laughing(){screen.append(arc(`M${exL-12} ${cyL-4} Q${exL} ${cyL+8} ${exL+12} ${cyL-4}`,TEAL,6),arc(`M${exR-12} ${cyL-4} Q${exR} ${cyL+8} ${exR+12} ${cyL-4}`,TEAL,6));topFx.append(txt(160,74,20,'ha ha!',GOLD));extra.laugh=true;},
    lovestruck(){screen.append(heartAt(exL,cyL,1.4),heartAt(exR,cyL,1.4));extra.pulse=220;extra.hearts=true;},

    smug(){screen.append(el('path',{d:`M${exL-13} ${cyL+3} Q${exL} ${cyL-5} ${exL+13} ${cyL-1}`,fill:'none',stroke:TEAL,'stroke-width':7,'stroke-linecap':'round'}),el('path',{d:`M${exR-13} ${cyL-1} Q${exR} ${cyL-5} ${exR+13} ${cyL+3}`,fill:'none',stroke:TEAL,'stroke-width':7,'stroke-linecap':'round'}));},
    annoyed(){screen.append(el('path',{d:`M${exL-13} ${cyL-6} L${exL+13} ${cyL-1}`,stroke:TEAL,'stroke-width':6,'stroke-linecap':'round'}),eye(exL,cyL+2,22,12,5),el('path',{d:`M${exR-13} ${cyL-1} L${exR+13} ${cyL-6}`,stroke:TEAL,'stroke-width':6,'stroke-linecap':'round'}),eye(exR,cyL+2,22,12,5));},
    grumpy(){screen.append(el('path',{d:`M${exL-13} ${cyL-7} L${exL+13} ${cyL-2}`,stroke:RED,'stroke-width':6,'stroke-linecap':'round'}),eye(exL,cyL+2,20,14,5,RED),el('path',{d:`M${exR-13} ${cyL-2} L${exR+13} ${cyL-7}`,stroke:RED,'stroke-width':6,'stroke-linecap':'round'}),eye(exR,cyL+2,20,14,5,RED));extra.light=RED;},
    challenging(){screen.append(el('path',{d:`M${exL-14} ${cyL-8} L${exL+14} ${cyL}`,stroke:RED,'stroke-width':7,'stroke-linecap':'round'}),eye(exL,cyL+3,18,10,4,RED),el('path',{d:`M${exR-14} ${cyL} L${exR+14} ${cyL-8}`,stroke:RED,'stroke-width':7,'stroke-linecap':'round'}),eye(exR,cyL+3,18,10,4,RED));extra.light=RED;extra.shake=true;},
    pout(){screen.append(arc(`M${exL-11} ${cyL+3} Q${exL} ${cyL-5} ${exL+11} ${cyL+3}`,TEAL,6),arc(`M${exR-11} ${cyL+3} Q${exR} ${cyL-5} ${exR+11} ${cyL+3}`,TEAL,6));extra.tilt=6;},
    bored(){screen.append(eye(exL,cyL+3,24,9,4),eye(exR,cyL+3,24,9,4),el('path',{d:`M${exL-12} ${cyL-6} L${exL+12} ${cyL-6}`,stroke:TEAL,'stroke-width':4,'stroke-linecap':'round',opacity:0.5}),el('path',{d:`M${exR-12} ${cyL-6} L${exR+12} ${cyL-6}`,stroke:TEAL,'stroke-width':4,'stroke-linecap':'round',opacity:0.5}));topFx.append(txt(206,84,16,'...',TEAL));},
    proud(){screen.append(arc(`M${exL-12} ${cyL} Q${exL} ${cyL+9} ${exL+12} ${cyL}`,TEAL,6),arc(`M${exR-12} ${cyL} Q${exR} ${cyL+9} ${exR+12} ${cyL}`,TEAL,6));},
    dizzy(){screen.append(el('path',{d:`M${exL} ${cyL} m-9,0 a9,9 0 1,1 18,0 a5,5 0 1,1 -10,0 a2,2 0 1,1 4,0`,fill:'none',stroke:TEAL,'stroke-width':3}),el('path',{d:`M${exR} ${cyL} m-9,0 a9,9 0 1,1 18,0 a5,5 0 1,1 -10,0 a2,2 0 1,1 4,0`,fill:'none',stroke:TEAL,'stroke-width':3}));extra.spin=true;},
    thinking(){screen.append(eye(exL,cyL-3,18,18,9),eye(exR,cyL-3,18,18,9));topFx.append(txt(206,80,20,'💭'));extra.tilt=-4;extra.blink=true;},
    scared(){screen.append(el('circle',{cx:exL,cy:cyL,r:16,fill:TEAL}),el('circle',{cx:exR,cy:cyL,r:16,fill:TEAL}),el('circle',{cx:exL,cy:cyL+2,r:5,fill:'#0A0C14'}),el('circle',{cx:exR,cy:cyL+2,r:5,fill:'#0A0C14'}));extra.tremble=true;},

    recovering(){screen.append(arc(`M${exL-11} ${cyL} Q${exL} ${cyL+7} ${exL+11} ${cyL}`,'#9BE6C0',6),arc(`M${exR-11} ${cyL} Q${exR} ${cyL+7} ${exR+11} ${cyL}`,'#9BE6C0',6));extra.light='#9BE6C0';},
    listening(){screen.append(eye(exL,cyL,24,22,10),eye(exR,cyL,24,22,10));extra.earPulse=true;extra.blink=true;},
    talking(){screen.append(eye(exL,cyL,26,20,9),eye(exR,cyL,26,20,9));extra.eq=true;},
    dancing(){screen.append(arc(`M${exL-12} ${cyL} Q${exL} ${cyL+9} ${exL+12} ${cyL}`,TEAL,6),arc(`M${exR-12} ${cyL} Q${exR} ${cyL+9} ${exR+12} ${cyL}`,TEAL,6));topFx.append(txt(200,78,20,'♪',GOLD),txt(122,88,16,'♫',GOLD));extra.dance=true;},
    // ---- Moves: full-body EMO-style animations ----

    run(){screen.append(el('circle',{cx:exL,cy:cyL,r:12,fill:TEAL}),el('circle',{cx:exR,cy:cyL,r:12,fill:TEAL}));const g=el('g',{id:'streaks'});for(let i=0;i<3;i++)g.append(el('rect',{x:0,y:0,width:26,height:5,rx:2.5,fill:TEAL,opacity:0}));fx.appendChild(g);extra.anim='run';},

    moonwalk(){screen.append(el('path',{d:`M${exL-13} ${cyL+3} Q${exL} ${cyL-5} ${exL+13} ${cyL-1}`,fill:'none',stroke:TEAL,'stroke-width':7,'stroke-linecap':'round'}),el('path',{d:`M${exR-13} ${cyL-1} Q${exR} ${cyL-5} ${exR+13} ${cyL+3}`,fill:'none',stroke:TEAL,'stroke-width':7,'stroke-linecap':'round'}));topFx.append(txt(202,78,18,'♪',GOLD));extra.anim='moon';},
    wiggle(){screen.append(arc(`M${exL-12} ${cyL+2} Q${exL} ${cyL+10} ${exL+12} ${cyL+2}`,TEAL,6),arc(`M${exR-12} ${cyL+2} Q${exR} ${cyL+10} ${exR+12} ${cyL+2}`,TEAL,6));extra.hearts=true;extra.anim='wiggle';},
    stretch(){screen.append(arc(`M${exL-12} ${cyL-2} Q${exL} ${cyL+6} ${exL+12} ${cyL-2}`,TEAL,7),arc(`M${exR-12} ${cyL-2} Q${exR} ${cyL+6} ${exR+12} ${cyL-2}`,TEAL,7));topFx.append(el('ellipse',{id:'yawnS',cx:160,cy:140,rx:3,ry:3,fill:'none',stroke:TEAL,'stroke-width':2.5,opacity:0}));extra.anim='stretch';},
    lookaround(){const g=el('g',{id:'gaze'});g.append(el('circle',{cx:exL,cy:cyL-2,r:11,fill:TEAL}),el('circle',{cx:exR,cy:cyL-2,r:11,fill:TEAL}));screen.append(g);extra.blink=true;extra.anim='look';},
    wave(){screen.append(eye(exL,cyL,26,20,9),eye(exR,cyL,26,20,9));topFx.append(txt(216,68,15,'hi!',GOLD));extra.blink=true;extra.anim='wave';},
    sit(){screen.append(arc(`M${exL-12} ${cyL+2} Q${exL} ${cyL+10} ${exL+12} ${cyL+2}`,TEAL,6),arc(`M${exR-12} ${cyL+2} Q${exR} ${cyL+10} ${exR+12} ${cyL+2}`,TEAL,6));extra.blink=true;extra.anim='sit';},
    // SLEEPY: drowsy, still awake — heavy HALF-open eyes, slow blinks, a yawn "O", head lolls a bit
    sleepy(){screen.append(
        el('rect',{x:exL-13,y:cyL-4,width:26,height:9,rx:4,fill:TEAL}),
        el('rect',{x:exR-13,y:cyL-4,width:26,height:9,rx:4,fill:TEAL}),
        el('path',{d:`M${exL-13} ${cyL-5} Q${exL} ${cyL-9} ${exL+13} ${cyL-5}`,fill:'none',stroke:'#0A0C14','stroke-width':5}),
        el('path',{d:`M${exR-13} ${cyL-5} Q${exR} ${cyL-9} ${exR+13} ${cyL-5}`,fill:'none',stroke:'#0A0C14','stroke-width':5})

    dozing(){screen.append(

      );

    },

      const h=el('g',{});h.append(el('path',{d:`M92 66 Q160 40 228 66 L228 60 Q160 34 92 60 Z`,fill:'#D64545'}),el('rect',{x:88,y:58,width:144,height:8,rx:4,fill:'#F4F6F8'}),el('circle',{cx:160,cy:48,r:8,fill:'#F4F6F8'}));topFx.append(h);extra.snow=true;},
    halloween(){screen.append(el('path',{d:`M${exL} ${cyL} m-13,0 a13,13 0 1,1 26,0 l0,10 l-5,-4 l-4,4 l-4,-4 l-4,4 l-4,-4 Z`,fill:'#B57BE5'}),el('path',{d:`M${exR} ${cyL} m-13,0 a13,13 0 1,1 26,0 l0,10 l-5,-4 l-4,4 l-4,-4 l-4,4 l-4,-4 Z`,fill:'#B57BE5'}),el('circle',{cx:exL,cy:cyL-2,r:4,fill:'#0A0C14'}),el('circle',{cx:exR,cy:cyL-2,r:4,fill:'#0A0C14'}));topFx.append(txt(160,78,15,'boo!','#B57BE5'));extra.float=true;extra.light='#B57BE5';},
    newyear(){screen.append(star(exL,cyL,12),star(exR,cyL,12));topFx.append(txt(160,76,15,'2026!',GOLD));extra.confetti=true;extra.pulse=180;},
    valentine(){screen.append(heartAt(exL,cyL,1.3,'#F27A7A'),heartAt(exR,cyL,1.3,'#F27A7A'));extra.hearts=true;extra.pulse=220;}
  };

  const GROUPS=[
    ['Core',['happy','excited','content','neutral','curious','confused','sad','surprised','laughing','lovestruck']],
    ['Moves',['walk','run','jump','flip','backflip','spin','moonwalk','wiggle','stretch','wave','lookaround','sit']],
    ['Attitude',['wink','smug','annoyed','grumpy','challenging','pout','bored','proud','dizzy','thinking','scared']],
    ['Health',['sick','unwell','recovering']],
    ['Activity',['listening','talking','dancing','sleepy','dozing']],
    ['Special',['birthday','christmas','halloween','newyear','valentine']]
  ];

  let hearts=[], confetti=[], snow=[], zzz=[], dusts=[], lastAir=0;
  function setMood(m){
    mood=m; t=0; clear(screen); clear(topFx); clear(fx); extra={};
    hearts=[]; confetti=[]; snow=[]; zzz=[]; dusts=[]; lastAir=0;
    lightL.setAttribute('fill',TEAL); lightR.setAttribute('fill',TEAL);
    lightL.setAttribute('opacity',1); lightR.setAttribute('opacity',1);
    screen.removeAttribute('transform'); screen.style.opacity='1'; headG.removeAttribute('transform');
    (M[m]||M.happy)();
    if(extra.light){lightL.setAttribute('fill',extra.light);lightR.setAttribute('fill',extra.light);}
    blinkT=1600+Math.random()*1500;
  }

  const gm=document.getElementById('groups');
  GROUPS.forEach(([name,list])=>{
    const lbl=document.createElement('div');lbl.textContent=name;lbl.style.cssText='color:#8B98AC;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px;';gm.appendChild(lbl);
    const row=document.createElement('div');row.style.cssText='display:flex;flex-wrap:wrap;gap:6px;';
    list.forEach(m=>{const b=document.createElement('button');b.textContent=m;b.style.cssText='font:inherit;font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #2E3547;background:#1a1f2b;color:#dfe3ea;cursor:pointer;';b.onclick=()=>setMood(m);row.appendChild(b);});
    gm.appendChild(row);
  });

  function renderFrame(dt){
    t+=dt;
    const slow=extra.slow?1600:620;
    const amp=(mood==='excited'||mood==='dancing')?7:extra.slow?1.5:3;
    let ty=Math.sin(t/slow)*amp, rot=Math.sin(t/1200)*0.8, rotCy=220;
    let tx=0, face=1, flip=0, sxb=1, headAdd=0, gazeX=0;
    let fL={dx:0,dy:0}, fR={dx:0,dy:0};
    let hL={dx:Math.sin(t/700)*1.2, dy:Math.sin(t/430)*2.4};        // floaty idle hover,
    let hR={dx:-Math.sin(t/640)*1.2, dy:Math.sin(t/430+1.7)*2.4};   // hands drift out of sync
    if(extra.shake){ty+=Math.sin(t/45)*2;rot+=Math.sin(t/40)*2;}
    if(extra.tremble){ty+=Math.sin(t/50)*1.5;}
    if(extra.dance){rot=Math.sin(t/220)*5;ty=Math.abs(Math.sin(t/220))*-6;}
    if(extra.float){ty=Math.sin(t/500)*8;}
    if(extra.laugh){ty=Math.abs(Math.sin(t/120))*-5;}
    if(extra.deepZ){rot=Math.sin(t/1600)*2.5;} // slow deep breathing nod

    // ---- move animations (poses computed facing right; mirroring handles left) ----
    const A=extra.anim;
    if(A==='walk'||A==='run'||A==='moon'){
      const T=A==='run'?4600:A==='moon'?11000:9000, AMP=64;
      const w=2*Math.PI*t/T, c=Math.cos(w);
      tx=AMP*Math.sin(w);                                    // roam across the stage
      const cad=Math.abs(c);                                 // slows near the edges...
      face=(c>=0?1:-1)*(A==='moon'?-1:1);                    // ...then turns around
      extra.ph=(extra.ph||0)+dt*(A==='run'?0.021:A==='moon'?0.009:0.013)*Math.max(cad,0.12);
      const ph=extra.ph;
      if(A==='moon'){                                        // glide backwards, feet shuffling
        rot=-4; ty=Math.sin(t/500)*1;
        const sl=Math.sin(ph);
        fL={dx:6+sl*6, dy:-Math.max(0,Math.sin(ph+2.2))*2.5};
        fR={dx:6-sl*6, dy:-Math.max(0,Math.sin(ph+2.2+Math.PI))*2.5};
        hL.dx+=sl*3; hR.dx+=-sl*3; hL.dy-=2; hR.dy-=2;       // hands trail the shuffle
      } else {                                               // step cycle: alternate lift + bounce
        const B=A==='run'?6.5:4, L=12, S=A==='run'?12:11;
        ty=-Math.abs(Math.sin(ph))*B*Math.max(cad,0.15);
        rot=(A==='run'?6:3.5)*cad+Math.sin(ph)*1.2;          // lean into the direction of travel
        fL={dx:Math.sin(ph)*S, dy:-Math.max(0,Math.sin(ph))*L*Math.max(cad,0.2)};
        fR={dx:Math.sin(ph+Math.PI)*S, dy:-Math.max(0,Math.sin(ph+Math.PI))*L*Math.max(cad,0.2)};
        const hs=A==='run'?8:5;                              // hands swing opposite the legs
        hL.dx+=-Math.sin(ph)*hs; hL.dy+=-Math.max(0,Math.sin(ph+Math.PI))*3;
        hR.dx+=Math.sin(ph)*hs;  hR.dy+=-Math.max(0,Math.sin(ph))*3;
      }
      if(A==='run'){const st=document.querySelectorAll('#streaks rect');st.forEach((r,i)=>{r.setAttribute('x',160+tx-face*(58+i*16)-13);r.setAttribute('y',152+i*28+ty);r.setAttribute('opacity',Math.max(0,cad*0.55-i*0.1).toFixed(2));});}
    }
    if(A==='jump'){                                          // crouch -> spring -> tuck -> land
      const p=(t%1600)/1600; rot=0; let plant=false;
      if(p<0.16){ty=kf(p,[[0,0],[0.16,14]]);plant=true;}
      else if(p<0.74){const q=(p-0.16)/0.58;ty=14-86*Math.sin(Math.PI*q);}
      else if(p<0.9){ty=kf(p,[[0.74,14],[0.9,0]]);plant=true;}
      else ty=0;
      if(plant){fL={dx:0,dy:-ty};fR=fL;hL.dy+=8;hR.dy+=8;hL.dx-=3;hR.dx+=3;} // feet planted, hands braced
      else{const tk=-Math.max(0,-ty)/70*10;fL={dx:0,dy:tk};fR=fL;            // tuck in the air,
        const a=Math.max(0,-ty)/70;hL.dy+=-a*15;hR.dy+=-a*15;hL.dx-=a*5;hR.dx+=a*5;} // hands up: wheee
    }
    if(A==='flip'){                                          // hop, deep crouch, full 360 in the air
      const p=(t%2400)/2400, dir=extra.dir||1; rot=0;
      if(p<0.08){ty=kf(p,[[0,0],[0.08,2]]);fL={dx:0,dy:-ty};fR=fL;}
      else if(p<0.26){ty=kf(p,[[0.08,2],[0.26,18]]);fL={dx:0,dy:-ty};fR=fL;}
      else if(p<0.72){const q=(p-0.26)/0.46;ty=18-104*Math.sin(Math.PI*q);flip=dir*360*(q*q*(3-2*q));const tk=-12*Math.sin(Math.PI*q);fL={dx:0,dy:tk};fR=fL;}
      else if(p<0.84){ty=kf(p,[[0.72,18],[0.84,2]]);fL={dx:0,dy:-ty};fR=fL;}
      else{ty=kf(p,[[0.84,2],[1,0]]);fL={dx:0,dy:-ty};fR=fL;}
      if(flip){hL.dx+=12;hR.dx+=-12;hL.dy-=4;hR.dy-=4;}      // hands tucked mid-spin
      else{hL.dy+=6;hR.dy+=6;}                               // braced low in crouch/landing
    }
    if(A==='spinP'){                                         // pirouette: fake 3D turn via x-scale
      const th=t/240; sxb=Math.cos(th);
      ty=-Math.abs(Math.sin(th))*3-2; rot=0;
      fL={dx:0,dy:-3};fR={dx:0,dy:-3};                       // up on tiptoes
      hL.dx-=5;hR.dx+=5;hL.dy-=9;hR.dy-=9;                   // ballerina arms out
    }
    if(A==='wiggle'){                                        // happy waddle, head stays level
      const w=Math.sin(t/95);
      rot=w*7; rotCy=252; ty=-Math.abs(w)*1.5; headAdd=-w*5;
      hL.dy-=5;hR.dy-=5;hL.dx-=w*2;hR.dx-=w*2;               // hands up, jiggling along
    }
    if(A==='stretch'){                                       // lean back + yawn, then touch toes
      const p=(t%4200)/4200; rotCy=258;
      rot=kf(p,[[0,0],[0.3,-11],[0.5,-11],[0.68,7],[0.8,7],[1,0]]);
      ty=kf(p,[[0,0],[0.3,-3],[0.5,-3],[0.68,5],[0.8,5],[1,0]]);
      headAdd=kf(p,[[0,0],[0.3,-6],[0.5,-6],[0.68,5],[0.8,5],[1,0]]);
      const y2=document.getElementById('yawnS');
      if(y2){const o=kf(p,[[0,0],[0.22,1],[0.5,1],[0.6,0]]);y2.setAttribute('opacity',o.toFixed(2));y2.setAttribute('ry',3+o*5);y2.setAttribute('rx',3+o*2);}
      const hup=kf(p,[[0,0],[0.3,-26],[0.5,-26],[0.68,12],[0.8,12],[1,0]]); // reach for the sky,
      const hout=kf(p,[[0,0],[0.3,-4],[0.5,-4],[0.7,0],[1,0]]);             // then toward the toes
      hL.dy+=hup;hR.dy+=hup;hL.dx+=hout;hR.dx-=hout;
    }
    if(A==='look'){                                          // glance left, hold, glance right
      const p=(t%5600)/5600;
      gazeX=kf(p,[[0,0],[0.12,-8],[0.38,-8],[0.5,8],[0.78,8],[0.9,0],[1,0]]);
      headAdd=gazeX*0.7;
    }
    if(A==='sit'){                                           // plop down, legs splay out, breathe
      const p=Math.min(1,t/650), e=p*p*(3-2*p), drop=26*e;
      ty=drop+(p>=1?Math.sin(t/850)*1.2:0);
      rot=Math.sin(t/1400)*0.5; rotCy=250;
      fL={dx:-14*e,dy:-drop};fR={dx:14*e,dy:-drop};
      hL.dy+=15*e;hR.dy+=15*e;hL.dx-=3*e;hR.dx+=3*e;         // hands come to rest at his sides
    }
    if(A==='wave'){                                          // right hand up high, waving hello
      hR.dx+=Math.sin(t/170)*8; hR.dy+=-36+Math.abs(Math.sin(t/170))*2;
      rot=Math.sin(t/170)*1;                                 // tiny sympathetic body sway
    }
    if(extra.dance){const dw=Math.sin(t/220);hL.dy+=dw*9-3;hR.dy+=-dw*9-3;hL.dx-=3;hR.dx+=3;} // hands pump with the beat
    if(mood==='excited'){const eb=Math.sin(t/160)*3;hL.dy+=-9+eb;hR.dy+=-9-eb;hL.dx-=4;hR.dx+=4;} // both hands up!

    // ---- landing detection -> dust puff at the feet ----
    const air=Math.max(0,-ty);
    lastAir=Math.max(lastAir,air);                 // peak height of the current hop
    if(air<2){if(lastAir>30)dust(160+tx);lastAir=0;} // touched down after a real jump
    dusts.forEach(d=>{d.life-=dt/450;const c=d.el;c.setAttribute('cx',parseFloat(c.getAttribute('cx'))+d.vx);c.setAttribute('cy',parseFloat(c.getAttribute('cy'))+d.vy);c.setAttribute('opacity',Math.max(0,d.life*0.6).toFixed(2));});
    dusts=dusts.filter(d=>{if(d.life<=0){d.el.remove();return false;}return true;});

    // ---- apply transforms ----
    rootG.setAttribute('transform',face<0?`translate(${tx} 0) translate(320 0) scale(-1 1)`:`translate(${tx} 0)`);
    let bt=`translate(0 ${ty})`;
    if(flip)bt+=` rotate(${flip%360} 160 168)`;
    else if(rot)bt+=` rotate(${rot} 160 ${rotCy})`;
    if(sxb!==1)bt+=` translate(160 0) scale(${sxb} 1) translate(-160 0)`;
    bobG.setAttribute('transform',bt);
    setLeg(legL,footLa,footLb,144,208,128,256,fL.dx,fL.dy,1);
    setLeg(legR,footRa,footRb,176,208,192,256,fR.dx,fR.dy,-1);
    handL.setAttribute('transform',`translate(${hL.dx.toFixed(2)} ${hL.dy.toFixed(2)})`);
    handR.setAttribute('transform',`translate(${hR.dx.toFixed(2)} ${hR.dy.toFixed(2)})`);
    const ss=1-Math.min(air,120)/170;
    shadow.setAttribute('transform',`translate(160 278) scale(${ss.toFixed(3)} ${(0.5+0.5*ss).toFixed(3)}) translate(-160 -278)`);
    shadow.setAttribute('opacity',(0.12*(0.35+0.65*ss)).toFixed(3));

    let tilt=(extra.tilt||0)+headAdd; if(extra.wobble)tilt+=Math.sin(t/500)*3;
    if(extra.deepZ)tilt+=Math.sin(t/1600)*2;
    if(extra.spin){headG.setAttribute('transform',`rotate(${(t/12)%360} 160 116)`);}
    else headG.setAttribute('transform',tilt?`rotate(${tilt} 160 116)`:'');
    const gz=document.getElementById('gaze'); if(gz)gz.setAttribute('transform',`translate(${gazeX} 0)`);

    if(extra.pulse){const p=1+Math.sin(t/extra.pulse)*0.13;screen.style.transformOrigin='160px 118px';screen.setAttribute('transform',`scale(${p})`);}
    if(extra.blink){blinkT-=dt;if(blinkT<=0){screen.style.opacity='0.12';setTimeout(()=>{screen.style.opacity='1';},100);blinkT=1800+Math.random()*2500;}}
    // drowsy: long slow heavy blinks (eyes dip closed slowly)
    if(extra.drowsyBlink){blinkT-=dt;if(blinkT<=0){screen.style.transition='opacity 0.35s';screen.style.opacity='0.1';setTimeout(()=>{screen.style.opacity='1';setTimeout(()=>{screen.style.transition='';},400);},500);blinkT=2600+Math.random()*1500;}
      const yawn=document.getElementById('yawn');if(yawn){const r=3+Math.abs(Math.sin(t/900))*5;yawn.setAttribute('ry',r);yawn.setAttribute('rx',3+Math.abs(Math.sin(t/900))*2);}}

    if(extra.eq){if(!document.getElementById('eqrt')){const g=el('g',{id:'eqrt'});for(let i=0;i<3;i++)g.append(el('rect',{x:150+i*8,y:140,width:5,height:10,rx:2,fill:TEAL}));topFx.append(g);}document.querySelectorAll('#eqrt rect').forEach((b,i)=>{const h=6+Math.abs(Math.sin(t/(90+i*30)))*20;b.setAttribute('height',h);b.setAttribute('y',150-h);});}

    if(extra.hearts){if(Math.random()<0.04){const hx=110+Math.random()*100,s=0.7+Math.random()*0.6;const h=heartAt(hx,150,s);fx.appendChild(h);hearts.push({el:h,x:hx,y:150,s,sway:Math.random()*6.28});}hearts.forEach(h=>{h.y-=1;h.sway+=0.04;const nx=h.x+Math.sin(h.sway)*7;h.el.setAttribute('d',`M${nx} ${h.y+6*h.s} L${nx-6*h.s} ${h.y-1*h.s} A${3.5*h.s} ${3.5*h.s} 0 0 1 ${nx} ${h.y-5*h.s} A${3.5*h.s} ${3.5*h.s} 0 0 1 ${nx+6*h.s} ${h.y-1*h.s} Z`);h.el.setAttribute('opacity',h.y<70?Math.max(0,(h.y-30)/40):1);});hearts=hearts.filter(h=>{if(h.y<28){h.el.remove();return false;}return true;});}

    if(extra.deepZ){if(Math.random()<0.02 && zzz.length<4){const size=12+Math.random()*8;const z=txt(205,90,size,'Z',TEAL);fx.appendChild(z);zzz.push({el:z,x:205,y:90,size});}zzz.forEach(z=>{z.y-=0.5;z.x+=0.3;z.el.setAttribute('x',z.x);z.el.setAttribute('y',z.y);z.el.setAttribute('opacity',z.y<50?Math.max(0,(z.y-25)/25):0.9);});zzz=zzz.filter(z=>{if(z.y<24){z.el.remove();return false;}return true;});}

    if(extra.confetti){if(Math.random()<0.15){const c=el('rect',{x:100+Math.random()*120,y:40,width:5,height:8,fill:[GOLD,PINK,TEAL,'#7BE58F'][Math.floor(Math.random()*4)]});fx.appendChild(c);confetti.push({el:c,x:parseFloat(c.getAttribute('x')),y:40,vx:(Math.random()-0.5)*1.2});}confetti.forEach(c=>{c.y+=1.6;c.x+=c.vx;c.el.setAttribute('y',c.y);c.el.setAttribute('x',c.x);c.el.setAttribute('transform',`rotate(${c.y*4} ${c.x} ${c.y})`);});confetti=confetti.filter(c=>{if(c.y>280){c.el.remove();return false;}return true;});}
    if(extra.snow){if(Math.random()<0.12){const s=el('circle',{cx:90+Math.random()*140,cy:40,r:2+Math.random()*2,fill:'#F4F6F8',opacity:0.9});fx.appendChild(s);snow.push({el:s,y:40});}snow.forEach(s=>{s.y+=0.8;s.el.setAttribute('cy',s.y);});snow=snow.filter(s=>{if(s.y>280){s.el.remove();return false;}return true;});}
    const flame=document.getElementById('flame');if(flame){flame.setAttribute('ry',4+Math.sin(t/120)*1.5);}
    if(extra.earPulse){const o=0.5+Math.abs(Math.sin(t/300))*0.5;lightL.setAttribute('opacity',o);lightR.setAttribute('opacity',o);}
  }
  function loop(now){const dt=Math.min(50,now-last);last=now;renderFrame(dt);if(!window.__byteManual)requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  // Small public API so the host app (or an LLM) can drive Byte programmatically:
  //   Byte.set('flip')  Byte.list()  -> all mood/move names
  window.Byte={set:setMood,list:()=>GROUPS.flatMap(g=>g[1]),_frame:renderFrame,_manual:v=>{window.__byteManual=v;if(!v){last=performance.now();requestAnimationFrame(loop);}}};
  setMood('walk');
})();
</script>
</div>
