<div style="padding:1rem 0;">
<h2 class="sr-only">Interactive preview of an emoji-style monkey face with expressive eyebrows that change per mood, showing happy, excited, curious, sleepy, confused, lovestruck and talking emotions; eyes follow your mouse.</h2>

<div style="display:flex;justify-content:center;margin-bottom:1.25rem;">
  <svg id="mk" width="280" height="280" viewBox="0 0 280 280" role="img" style="max-width:66vw;">
    <title>Byte monkey emoji face</title>
    <desc>A rounded monkey face with expressive eyebrows that change with mood and eyes that follow the cursor.</desc>

    <g id="heartsFloat"></g>

    <g id="bobG">
      <circle cx="70" cy="128" r="34" fill="#7A4E2D"/>
      <circle cx="70" cy="128" r="20" fill="#C89B72"/>
      <circle cx="210" cy="128" r="34" fill="#7A4E2D"/>
      <circle cx="210" cy="128" r="20" fill="#C89B72"/>

      <path d="M140 60 C196 60 214 104 214 140 C214 186 182 214 140 214 C98 214 66 186 66 140 C66 104 84 60 140 60 Z" fill="#8A5A34"/>
      <path d="M96 150 C96 112 118 100 140 100 C162 100 184 112 184 150 C184 190 164 204 140 204 C116 204 96 190 96 150 Z" fill="#E9CBA0"/>

      <g id="ewL"><ellipse cx="118" cy="138" rx="20" ry="24" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2.5"/></g>
      <g id="ewR"><ellipse cx="162" cy="138" rx="20" ry="24" fill="#FFFFFF" stroke="#2C2C2A" stroke-width="2.5"/></g>
      <g id="irisL"><circle cx="118" cy="140" r="11" fill="#4A2E18"/><circle cx="118" cy="140" r="6" fill="#1a1a1a"/><circle cx="114.5" cy="136.5" r="3" fill="#FFFFFF"/></g>
      <g id="irisR"><circle cx="162" cy="140" r="11" fill="#4A2E18"/><circle cx="162" cy="140" r="6" fill="#1a1a1a"/><circle cx="158.5" cy="136.5" r="3" fill="#FFFFFF"/></g>
      <g id="heartEyeL" style="opacity:0"><path d="M118 147 L109 138 A5.5 5.5 0 0 1 118 132 A5.5 5.5 0 0 1 127 138 Z" fill="#E24B6A"/></g>
      <g id="heartEyeR" style="opacity:0"><path d="M162 147 L153 138 A5.5 5.5 0 0 1 162 132 A5.5 5.5 0 0 1 171 138 Z" fill="#E24B6A"/></g>

      <path id="browL" d="M104 112 Q118 106 132 111" fill="none" stroke="#4A2E18" stroke-width="5" stroke-linecap="round"/>
      <path id="browR" d="M148 111 Q162 106 176 112" fill="none" stroke="#4A2E18" stroke-width="5" stroke-linecap="round"/>

      <ellipse cx="131" cy="166" rx="3.5" ry="4.5" fill="#2C2C2A"/><ellipse cx="149" cy="166" rx="3.5" ry="4.5" fill="#2C2C2A"/>
      <path id="mouth" d="M120 182 Q140 198 160 182" fill="none" stroke="#6E4326" stroke-width="4" stroke-linecap="round"/>
      <ellipse id="cheekL" cx="104" cy="172" rx="11" ry="7" fill="#D98A5A" opacity="0"/>
      <ellipse id="cheekR" cx="176" cy="172" rx="11" ry="7" fill="#D98A5A" opacity="0"/>
    </g>
  </svg>
</div>

<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px;margin:0 auto;">
  <button data-m="happy">Happy</button>
  <button data-m="excited">Excited</button>
  <button data-m="curious">Curious</button>
  <button data-m="sleepy">Sleepy</button>
  <button data-m="confused">Confused</button>
  <button data-m="lovestruck">Lovestruck</button>
  <button data-m="neutral">Neutral</button>
  <button data-m="talk">Talk</button>
</div>

<script>
(function(){
  const svg=document.getElementById('mk'), bob=document.getElementById('bobG');
  const irisL=document.getElementById('irisL'), irisR=document.getElementById('irisR');
  const ewL=document.getElementById('ewL'), ewR=document.getElementById('ewR');
  const heartEyeL=document.getElementById('heartEyeL'), heartEyeR=document.getElementById('heartEyeR');
  const browL=document.getElementById('browL'), browR=document.getElementById('browR');
  const mouth=document.getElementById('mouth');
  const cheekL=document.getElementById('cheekL'), cheekR=document.getElementById('cheekR');
  const floatWrap=document.getElementById('heartsFloat');
  const baseL={x:118,y:140}, baseR={x:162,y:140};
  let mood='happy', talking=false, talkUntil=0, mx=140, my=140, t=0, last=performance.now();
  const mouths={
    happy:"M120 182 Q140 198 160 182",
    excited:"M118 180 Q140 204 162 180 Q140 192 118 180 Z",
    curious:"M134 188 Q140 184 146 188",
    sleepy:"M132 188 Q140 192 148 188",
    confused:"M122 188 Q134 182 142 190 Q150 196 158 188",
    lovestruck:"M118 180 Q140 200 162 180",
    neutral:"M130 186 L150 186"
  };
  const brows={
    happy:      {l:"M104 111 Q118 105 132 110", r:"M148 110 Q162 105 176 111"},
    excited:    {l:"M104 106 Q118 99 132 104",  r:"M148 104 Q162 99 176 106"},
    curious:    {l:"M104 107 Q118 100 132 105", r:"M148 114 Q162 109 176 116"},
    sleepy:     {l:"M104 116 Q118 114 132 115", r:"M148 115 Q162 114 176 116"},
    confused:   {l:"M104 105 Q118 100 132 109", r:"M148 116 Q162 112 176 119"},
    lovestruck: {l:"M104 110 Q118 103 132 109", r:"M148 109 Q162 103 176 110"},
    neutral:    {l:"M104 113 Q118 109 132 113", r:"M148 113 Q162 109 176 113"},
    talk:       {l:"M104 111 Q118 105 132 110", r:"M148 110 Q162 105 176 111"}
  };

  let hearts=[];
  function heartPath(x,y,s){return `M${x} ${y+6*s} L${x-6*s} ${y-1*s} A${3.5*s} ${3.5*s} 0 0 1 ${x} ${y-5*s} A${3.5*s} ${3.5*s} 0 0 1 ${x+6*s} ${y-1*s} Z`;}
  function spawnHeart(){const p=document.createElementNS('http://www.w3.org/2000/svg','path');const x=95+Math.random()*90,s=0.75+Math.random()*0.85;p.setAttribute('fill',Math.random()<0.5?'#E24B6A':'#ED93B1');floatWrap.appendChild(p);hearts.push({el:p,x,y:130,s,vy:0.35+Math.random()*0.3,sway:Math.random()*6.28});}

  function blink(c){const ry=c?'3':'24';ewL.querySelector('ellipse').setAttribute('ry',ry);ewR.querySelector('ellipse').setAttribute('ry',ry);
    if(mood!=='lovestruck'){irisL.style.opacity=c?'0':'1';irisR.style.opacity=c?'0':'1';}}

  function setMood(m){mood=m;talking=false;
    const love=(m==='lovestruck');
    heartEyeL.style.opacity=love?'1':'0';heartEyeR.style.opacity=love?'1':'0';
    irisL.style.opacity=love?'0':'1';irisR.style.opacity=love?'0':'1';
    cheekL.setAttribute('opacity',(m==='excited')?'0.9':'0');cheekR.setAttribute('opacity',(m==='excited')?'0.9':'0');
    const b=brows[m]||brows.happy; browL.setAttribute('d',b.l); browR.setAttribute('d',b.r);
    if(m==='talk'){talking=true;talkUntil=performance.now()+2600;}else mouth.setAttribute('d',mouths[m]||mouths.happy);
    blink(m==='sleepy');
    if(!love){hearts.forEach(h=>h.el.remove());hearts=[];}
  }
  svg.addEventListener('mousemove',e=>{const r=svg.getBoundingClientRect();mx=((e.clientX-r.left)/r.width)*280;my=((e.clientY-r.top)/r.height)*280;});
  svg.addEventListener('mouseleave',()=>{mx=140;my=140;});
  function track(base,el){const dx=mx-base.x,dy=my-base.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,7);el.setAttribute('transform',`translate(${dx/d*m} ${dy/d*m})`);}
  let nextBlink=1500,heartTimer=0;
  function loop(now){const dt=now-last;last=now;t+=dt;
    bob.style.transformOrigin='140px 214px';bob.setAttribute('transform',`translate(0 ${Math.sin(t/620)*3}) rotate(${Math.sin(t/1100)*1} 140 160)`);
    if(mood==='lovestruck'){const p=1+Math.sin(t/220)*0.12;heartEyeL.style.transformOrigin='118px 138px';heartEyeR.style.transformOrigin='162px 138px';heartEyeL.setAttribute('transform',`scale(${p})`);heartEyeR.setAttribute('transform',`scale(${p})`);heartTimer-=dt;if(heartTimer<=0){spawnHeart();heartTimer=420;}}
    else if(mood!=='sleepy'){track(baseL,irisL);track(baseR,irisR);}
    if(mood!=='sleepy'&&mood!=='lovestruck'){nextBlink-=dt;if(nextBlink<=0){blink(true);setTimeout(()=>{if(mood!=='sleepy'&&mood!=='lovestruck')blink(false);},110);nextBlink=1800+Math.random()*2500;}}
    hearts.forEach(h=>{h.y-=h.vy*dt*0.06;h.sway+=dt*0.003;const x=h.x+Math.sin(h.sway)*9;const op=h.y<85?Math.max(0,(h.y-50)/35):1;h.el.setAttribute('d',heartPath(x,h.y,h.s));h.el.setAttribute('opacity',op);});
    hearts=hearts.filter(h=>{if(h.y<52){h.el.remove();return false;}return true;});
    if(talking){if(now<talkUntil){const o=5+Math.abs(Math.sin(t/90))*12;mouth.setAttribute('d',`M120 182 Q140 ${182+o} 160 182 Q140 ${182+o*0.5} 120 182 Z`);}else{talking=false;setMood('happy');}}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>setMood(b.dataset.m)));
  setMood('happy');
})();
</script>
</div>
